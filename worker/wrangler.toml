name = "alcor-human-check"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
WORLD_APP_ID = "app_FAKE_REPLACE_IN_PORTAL"
WORLD_RP_ID = "rp_FAKE_REPLACE_IN_PORTAL"
WORLD_ACTION = "mizar-00000000" # FAKE: replace with the registered mizar-<eventId first 8 hex> action
WORLD_ENV = "staging"

[[d1_databases]]
binding = "DB"
database_name = "alcor-human-check-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
