name = "alcor-human-check"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "pnpm --dir ../web build"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[vars]
WORLD_ACTION = "mizar-ccb8770a"
WORLD_ENV = "staging"
# Staging-only World ID 3.0 compatibility mode; ignored unless WORLD_ENV is "staging".
WORLD_LEGACY_STAGING = "on"
# WORLD_APP_ID and WORLD_RP_ID are supplied with secret put during deployment.
# WORLD_RP_SIGNING_KEY and ATTESTATION_KEY must also be secret bindings.

[[d1_databases]]
binding = "DB"
database_name = "alcor-human-check"
database_id = "0b193582-d696-417e-9b80-37c51327be7d"
migrations_dir = "migrations"

[observability]
enabled = true
